name: Release Windows x64

on:
  push:
    tags:
      - "v*.*.*"
      - "v*"
  workflow_dispatch:
    inputs:
      bump:
        description: "Automatic version increment"
        type: choice
        options:
          - mod
          - patch
          - minor
          - major
          - custom
          - none
        default: mod
      custom_version:
        description: "Custom version (only if bump is 'custom', e.g. 0.73.2-m1)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: release-windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-windows:
    name: Build & Publish Windows x64
    runs-on: windows-2025
    timeout-minutes: 45
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Calculate & increment version
        id: versioning
        shell: pwsh
        run: |
          $pkg = Get-Content package.json -Raw | ConvertFrom-Json
          $current = $pkg.version
          Write-Output "Current package.json version: $current"
          
          if ($env:GITHUB_EVENT_NAME -eq "push") {
            $tag = $env:GITHUB_REF_NAME
            $cleanVer = $tag.TrimStart("v")
            $newVer = $cleanVer
          } else {
            $bump = "${{ inputs.bump }}"
            $custom = "${{ inputs.custom_version }}".Trim().TrimStart("v")
            
          $semverRegex = '^(\d+)\.(\d+)\.(\d+)(?:-m(\d+))?$'
          if ($current -match $semverRegex) {
            $major = [int]$matches[1]
            $minor = [int]$matches[2]
            $patch = [int]$matches[3]
            $mod = if ($matches[4]) { [int]$matches[4] } else { 0 }
          } else {
            $parts = $current.Split('-')[0].Split('.')
            $major = [int]$parts[0]
            $minor = [int]$parts[1]
            $patch = [int]$parts[2]
            $mod = 0
          }
          
          if ($bump -eq "custom" -and $custom) {
            $newVer = $custom
          } elseif ($bump -eq "mod") {
            $newMod = if ($mod -gt 0) { $mod + 1 } else { 1 }
            $newVer = "$major.$minor.$patch-m$newMod"
          } elseif ($bump -eq "patch") {
            $newVer = "$major.$minor.$($patch + 1)-m1"
          } elseif ($bump -eq "minor") {
            $newVer = "$major.$($minor + 1).0-m1"
          } elseif ($bump -eq "major") {
            $newVer = "$($major + 1).0.0-m1"
          } else {
            $newVer = $current
          }
          $tag = "v$newVer"
          }

          Write-Output "Target release version: $newVer (tag: $tag)"
          "version=$newVer" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT

          # Update package.json if version changed
          if ($current -ne $newVer) {
            $content = Get-Content package.json -Raw
            $updated = $content -replace '("version"\s*:\s*")[^"]*(")', "`${1}$newVer`${2}"
            Set-Content -Path package.json -Value $updated -NoNewline
            
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add package.json
            git commit -m "chore(release): bump version to $tag [skip ci]"
            git push origin HEAD
          }

          git tag -f "$tag"
          git push origin "$tag" --force

      - name: Set up Bun & dependencies
        uses: ./.github/actions/setup-bun
        with:
          install: frozen

      - name: Build Windows x64 installer
        shell: pwsh
        run: |
          bun run dist:win

      - name: Generate SHA256 Checksums
        shell: pwsh
        run: |
          Set-Location dist
          $files = Get-ChildItem -File -Filter *.exe
          $checksums = foreach ($file in $files) {
            $hash = (Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($file.Name)"
          }
          $checksums | Set-Content SHA256SUMS-windows-x64.txt
          Get-Content SHA256SUMS-windows-x64.txt

      - name: Publish GitHub Release
        shell: pwsh
        run: |
          $tag = "${{ steps.versioning.outputs.tag }}"
          $title = "OpenBot $tag"
          $files = Get-ChildItem dist/*.exe, dist/latest.yml, dist/SHA256SUMS-windows-x64.txt -ErrorAction SilentlyContinue | ForEach-Object { $_.FullName }
          
          # Check if release already exists on GitHub
          $existingReleases = gh release list --json tagName -q ".[].tagName" 2>$null
          if ($existingReleases -contains $tag) {
            Write-Output "Release $tag exists. Uploading assets..."
            gh release upload $tag $files --clobber
          } else {
            Write-Output "Creating release $tag..."
            gh release create $tag $files --title $title --generate-notes
          }
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
