name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop-ci:
    name: Desktop CI & Build Smoke Test
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Bun & dependencies
        uses: ./.github/actions/setup-bun
        with:
          install: frozen

      - name: Check frozen migrations
        shell: pwsh
        run: |
          bun run check:migrations

      - name: Typecheck codebase
        shell: pwsh
        run: |
          bun x tsc --noEmit -p tsconfig.json

      - name: Build desktop app (Vite & Electron)
        shell: pwsh
        run: |
          bun run build
