<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>OpenBot</title>
    <script>
      (function() {
        function showFatal(title, detail) {
          console.error("[EARLY CRASH]", title, detail);
          try {
            var box = document.getElementById("openbot-early-crash");
            if (!box) {
              box = document.createElement("div");
              box.id = "openbot-early-crash";
              box.style.cssText = "position:fixed;top:32px;left:16px;right:16px;bottom:16px;background:#18181b;color:#f87171;border:2px solid #ef4444;border-radius:8px;padding:20px;font-family:monospace;font-size:12px;z-index:999999999;overflow:auto;white-space:pre-wrap;";
              (document.body || document.documentElement).appendChild(box);
            }
            box.innerText = "CRITICAL INITIALIZATION ERROR:\n" + title + "\n\n" + (detail || "");
          } catch (_) {}
        }
        window.addEventListener("error", function(e) {
          showFatal(e.message, (e.error && e.error.stack) ? e.error.stack : (e.filename + ":" + e.lineno + ":" + e.colno));
        });
        window.addEventListener("unhandledrejection", function(e) {
          showFatal("Unhandled Promise Rejection", (e.reason && e.reason.stack) ? e.reason.stack : String(e.reason));
        });
      })();
    </script>
  </head>
  <body>
    <noscript>OpenBot requires JavaScript to run.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
